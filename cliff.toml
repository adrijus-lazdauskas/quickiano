# git-cliff config: https://git-cliff.org/docs/configuration
# Changelog from the conventional commits on main.
#
#   npm run changelog -- --tag 0.2.0    # write CHANGELOG.md for the next version
#   npx git-cliff --unreleased          # preview what is not released yet

[changelog]
header = """
# Changelog\n
All notable changes to Quickiano. Generated by [git-cliff](https://git-cliff.org) from the conventional commits on main.\n
"""
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version }}](<REPO>/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version }}](<REPO>/tree/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [{ pattern = '<REPO>', replace = "https://github.com/adrijus-lazdauskas/quickiano" }]

[git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](<REPO>/pull/${1}))" },
]
# The first match wins; the number in the comment orders the sections.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^ref", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^(chore|ci|build)", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert", group = "<!-- 8 -->◀️ Revert" },
]
# plain semver tags without a "v": 0.1.0
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order_commits = true
sort_commits = "oldest"
