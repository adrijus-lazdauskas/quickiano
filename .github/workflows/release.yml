name: Release

# Runs on a pushed version tag like 0.1.0 and publishes a GitHub release
# with the notes for that version. CHANGELOG.md is written before tagging
# with `npm run changelog -- --tag <version>` and committed as chore(release).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          args: --current --strip header

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.content }}
        run: gh release create "$GITHUB_REF_NAME" --title "Quickiano $GITHUB_REF_NAME" --notes "$NOTES" --verify-tag
