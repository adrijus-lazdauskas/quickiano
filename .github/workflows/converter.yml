name: Converter

# Tests the PDF converter in server/ and deploys it to Modal (https://modal.com).
# One-time setup in this repo (Settings → Secrets and variables → Actions → Secrets):
#   MODAL_TOKEN_ID      from modal.com → Settings → API Tokens → New Token
#   MODAL_TOKEN_SECRET  shown together with the token id
# Without them the deploy job only leaves a notice.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/converter.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/converter.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    name: Deploy to Modal
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - name: Check the Modal token
        id: token
        env:
          ID: ${{ secrets.MODAL_TOKEN_ID }}
          SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # only whether they exist as variables by mistake, never their values
          ID_AS_VARIABLE: ${{ vars.MODAL_TOKEN_ID != '' }}
          SECRET_AS_VARIABLE: ${{ vars.MODAL_TOKEN_SECRET != '' }}
        run: |
          missing=""
          [ -z "$ID" ] && missing="$missing MODAL_TOKEN_ID"
          [ -z "$SECRET" ] && missing="$missing MODAL_TOKEN_SECRET"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hint="Add them under Settings → Secrets and variables → Actions → Secrets → Repository secrets. Environment secrets (for example of github-pages) are not visible to this job."
          if [ "$ID_AS_VARIABLE" = "true" ] || [ "$SECRET_AS_VARIABLE" = "true" ]; then
            hint="They were saved as variables: delete them in the Variables tab and add them in the Secrets tab instead."
          fi
          echo "::notice title=Converter not deployed::Missing repository secret(s):$missing. $hint"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - if: steps.token.outputs.ready == 'true'
        run: pip install modal==1.6.2

      - name: Deploy
        if: steps.token.outputs.ready == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          COLUMNS: "200"
          NO_COLOR: "1"
        run: |
          set -o pipefail
          if ! modal deploy modal_app.py 2>&1 | tee deploy.log; then
            # Modal prints errors in a box; keep the text inside it on one line.
            reason="$(sed -n '/Error/,$p' deploy.log | tr -d '│╭╮╰╯─' | tr -s ' \n' ' ' | cut -c1-600)"
            echo "::error title=Modal deploy failed::${reason:-see the log of this step}"
            exit 1
          fi
          url="$(grep -oE 'https://[a-z0-9-]+--quickiano-converter\.modal\.run' deploy.log | head -n 1 || true)"
          echo "::notice title=Converter address::${url:-https://<workspace>--quickiano-converter.modal.run}"

      - name: Self-test on Modal
        if: steps.token.outputs.ready == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          COLUMNS: "200"
          NO_COLOR: "1"
        run: |
          set -o pipefail
          # Converts a public domain sheet (tests/fixtures/fur-elise.pdf) in the real container.
          if modal run modal_app.py::check 2>&1 | tee selftest.log; then
            echo "::notice title=Converter self-test passed::$(grep -o 'SELFTEST .*' selftest.log | tail -n 1 | cut -c10-)"
          else
            reason="$(grep -vE '^[[:space:]]*$' selftest.log | tail -n 25 | tr -d '│╭╮╰╯─' | tr -s ' \n' ' ' | cut -c1-1500)"
            echo "::error title=Converter self-test failed::${reason:-see the log of this step}"
            exit 1
          fi
