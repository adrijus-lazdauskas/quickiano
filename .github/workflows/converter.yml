name: Converter

# Tests the PDF converter in server/ and deploys it to a Hugging Face Space.
# One-time setup in this repo (Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  a Hugging Face access token with write permission
#   variable HF_SPACE  the Space id, e.g. your-name/quickiano-converter
# Without HF_SPACE the deploy job is skipped and only the tests run.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/converter.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/converter.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    name: Deploy to Hugging Face
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error title=HF_TOKEN is missing::Add a repository secret named HF_TOKEN (Settings → Secrets and variables → Actions → Secrets → New repository secret) holding a Hugging Face token with write access."
            exit 1
          fi

      - run: pip install huggingface_hub==2.2.0

      - name: Upload server/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import os
          import sys

          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError

          def fail(title, message):
              print(f"::error title={title}::{message}")
              sys.exit(1)

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"].strip()
          try:
              me = api.whoami()
          except HfHubHTTPError as e:
              fail("Hugging Face rejected the token", f"HF_TOKEN was not accepted ({str(e).splitlines()[0]}). Create a new token with write access and save it again as HF_TOKEN.")
          token = me.get("auth", {}).get("accessToken", {})
          print(f"Token of {me['name']}, role {token.get('role')}")
          if space.split("/")[0] not in [me["name"], *[o["name"] for o in me.get("orgs", [])]]:
              fail("HF_SPACE does not match the token", f"HF_SPACE is '{space}', but the token belongs to '{me['name']}'. Set HF_SPACE to {me['name']}/quickiano-converter.")
          if token.get("role") == "read":
              fail("The token is read-only", "Create a Hugging Face token with the type Write and save it again as HF_TOKEN.")
          try:
              # Creates the Space on the first run (free CPU hardware), then just updates it.
              api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
              api.upload_folder(
                  repo_id=space,
                  repo_type="space",
                  folder_path="server",
                  ignore_patterns=["tests/*", "requirements-dev.txt", "__pycache__/*", "*.pyc"],
                  commit_message=f"Deploy quickiano@{os.environ['SHA'][:7]}",
              )
          except HfHubHTTPError as e:
              status = e.response.status_code if e.response is not None else "?"
              hint = " A fine-grained token needs write access to your repositories (spaces)." if status in (401, 403) else ""
              fail(f"Hugging Face answered {status}", f"{str(e).splitlines()[0]}{hint}")
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          EOF
