name: Converter

# Tests the PDF converter in server/ and deploys it to Modal (https://modal.com).
# One-time setup in this repo (Settings → Secrets and variables → Actions → Secrets):
#   MODAL_TOKEN_ID      from modal.com → Settings → API Tokens → New Token
#   MODAL_TOKEN_SECRET  shown together with the token id
# Without them the deploy job only leaves a notice.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/converter.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/converter.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    name: Deploy to Modal
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - name: Check the Modal token
        id: token
        env:
          ID: ${{ secrets.MODAL_TOKEN_ID }}
          SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$ID" ] || [ -z "$SECRET" ]; then
            echo "::notice title=Converter not deployed::Add the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (Settings → Secrets and variables → Actions → Secrets) to deploy it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.ready == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - if: steps.token.outputs.ready == 'true'
        run: pip install modal==1.6.2

      - name: Deploy
        if: steps.token.outputs.ready == 'true'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          COLUMNS: "200"
        run: |
          set -o pipefail
          if ! modal deploy modal_app.py 2>&1 | tee deploy.log; then
            reason="$(grep -iE 'error|denied|invalid|limit|billing|payment' deploy.log | tail -n 1 | cut -c1-300)"
            echo "::error title=Modal deploy failed::${reason:-see the log of this step}"
            exit 1
          fi
          url="$(grep -oE 'https://[a-z0-9-]+--quickiano-converter\.modal\.run' deploy.log | head -n 1)"
          echo "::notice title=Converter address::${url:-not found in the log}"
