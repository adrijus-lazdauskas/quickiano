name: Pages redirect

# The app lives on Cloudflare Pages (https://quickiano.pages.dev/), which builds
# main by itself. GitHub Pages only keeps the old address working: every path
# under adrijus-lazdauskas.github.io/quickiano/ forwards to the new site.
on:
  push:
    branches: [main]
    paths:
      - scripts/pages-redirect.html
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish the redirect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the redirect site
        run: |
          mkdir -p site
          cp scripts/pages-redirect.html site/index.html
          cp scripts/pages-redirect.html site/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
